# Minimal Forgejo Actions workflow: run scripts/build-static.sh on every push
# to nash-local (and on manual dispatch from the web UI).
#
# This is the "Pattern A" shape from the forgejo-actions skill — run a host
# script at its canonical path. The runner is self-hosted and shares the
# filesystem with /home/hermes/repos/, so we invoke the script directly at
# its known location instead of checking out a copy.
#
# build-static.sh now takes two positional args:
#   $1 = DOMAIN      bare host (default: frees.au) — script builds https://$DOMAIN
#   $2 = OUTPUT_DIR  where Tome writes output (default: $REPO_ROOT/_static-build)
#
# We pass them explicitly so the workflow declares its targets rather than
# relying on the script's defaults — easier to spot a drift in PR review.
name: Build Tome static export

on:
  push:
    branches:
      - nash-local
  pull_request:
    branches:
      - nash-local
  workflow_dispatch:

env:
  REPO_ROOT: /home/hermes/repos/frees-au-ce
  BUILD_TARGET: /home/runner/artifacts/frees-au-ce

# Cancel any in-flight build if a new push arrives on the same ref.
concurrency:
  group: build-tome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tome:
    runs-on: self-hosted

    steps:
      - name: Copy the db to somewhere that `runner` can write it.
        run: cp "$REPO_ROOT/database/live.sqlite" /home/runner/frees-au-ce.sqlite
      - name: Build with prod domain
        run: bash "$REPO_ROOT/scripts/build-static.sh" www.frees.au "$BUILD_TARGET/prod"
      - name: Build with local domain
        run: bash "$REPO_ROOT/scripts/build-static.sh" www-local.frees.au "$BUILD_TARGET/local"
