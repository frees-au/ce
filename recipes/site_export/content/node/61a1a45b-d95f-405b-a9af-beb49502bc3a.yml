  lead:
    -
      value: '<p>Digital services from strategy and design through to development, integration and ongoing support. Explore how Free Sauce can help with your next project.</p>'
      format: basic
  markup:
    -
      value: '<h2>Explore our services</h2><ul><li data-list-item-id="e9c927641b4b06cdf11783c1478e4daf8"><h3><a href="/ce/services/agent-harness-design">Agent Harness Design</a></h3><p>Design AI agent harnesses and orchestration, with practical tooling, LLM integration, local AI infrastructure and connections to existing software.</p></li><li data-list-item-id="e4cc2e55ced5543c33e13e4aa03c53f06"><h3><a href="/ce/services/application-support">Application Support</a></h3><p>GovCMS SaaS/PaaS and externally hosted Drupal maintenance, triage, security updates, defects, enhancements, releases, reporting and technical account coordination.</p></li><li data-list-item-id="e42d98ba578ae44cf0a299aa195aa9bf4"><h3><a href="/ce/services/cloud-platforms">Cloud Platforms</a></h3><p>Cloud platform consulting across GCP and AWS, including BigQuery analytics, Dataform ELT, Firebase application backends, and Drupal hosting on Acquia Cloud and Lagoon.</p></li><li data-list-item-id="ead7e5ee2b2b70b654eae3e723d006fad"><h3><a href="/ce/services/decoupled-cms">Decoupled CMS</a></h3><p>Headless CMS architecture and development with Drupal, Next.js, React, Nuxt, GraphQL and JSON:API. Connect a shared content backend to the frontend experiences your team needs.</p></li><li data-list-item-id="e7665f4413fefa55d6254c45342748b0c"><h3><a href="/ce/services/delivery-and-panel-management">Delivery and Panel Management</a></h3><p>Panel obligations, agency relationships, reporting, commercial controls, scope, risk, budget, changes, acceptance and escalation; delivery coordination and QA/UAT.</p></li><li data-list-item-id="e2683e8e51b8b2f0f245654a5653dbec4"><h3><a href="/ce/services/data-engineering-and-analytics">Data Engineering and Analytics</a></h3><p>Connect your data, measure what matters and turn reliable information into practical decisions. We bring together data engineering, analytics and reporting, from pipelines and platforms to dashboards and ongoing optimisation.</p></li><li data-list-item-id="e3f41bd656bd994796fa4db681754dac1"><h3><a href="/ce/services/drupal-cms">Drupal CMS</a></h3><p>Drupal consulting, site building, custom modules, themes and architecture. Build structured content, editorial workflows and maintainable websites around your organisation’s needs.</p></li><li data-list-item-id="e79bdd0a9e58c4fa74fa8a38b2d339e5c"><h3><a href="/ce/services/headless-and-decoupled-solutions">Headless and Decoupled Solutions</a></h3><p>Design and build headless and decoupled solutions that connect flexible front ends to structured content and business systems. Balance the freedom to shape the experience with practical editorial workflows and maintainable delivery.</p></li><li data-list-item-id="e6906172ab95e231c0155d9675c3e1924"><h3><a href="/ce/services/ecommerce-and-website-operations">Ecommerce and Website Operations</a></h3><p>WordPress/PHP themes, Shopify, Squarespace/Wix, ACF/Gravity Forms, hosting/DNS/SSL, Git and staging/production operations; catalogue/fulfilment/API automation.</p></li><li data-list-item-id="e490ffee42496be3a6a8a3213f3f3abc5"><h3><a href="/ce/services/frontend-and-design-systems">Frontend and Design Systems</a></h3><p>Drupal themes and reusable frontend components; responsive interfaces, design-system implementation, API-driven applications and design-to-code delivery.</p></li><li data-list-item-id="e216bfaf9378c9338a04c0dea357c7cf4"><h3><a href="/ce/services/govcms">GovCMS</a></h3><p>GovCMS site building, maintenance and integration planning for Australian government websites. Work within SaaS and PaaS platform constraints, with appropriate design systems and editorial workflows.</p></li><li data-list-item-id="e3372eb24984d4058766623dbc644fd2a"><h3><a href="/ce/services/information-architecture">Information Architecture and Content Strategy</a></h3><p>Drupal information architecture, content strategy and content design, with a focus on usability, readability and accessibility. Restructure and migrate large content datasets, using machine learning to support the process where appropriate.</p></li><li data-list-item-id="e7c06da8fdd72d860c9698c44f0715f08"><h3><a href="/ce/services/ux-and-ui-design">UX and UI Design</a></h3><p>Research-informed wireframes, desktop/mobile prototypes, interaction and visual design, usability validation and design-to-build handover.</p></li></ul><h2>Work with Free Sauce</h2><p>We bring together digital strategy, design, Drupal engineering, data and operational support. Service scope, specialist availability and delivery arrangements are agreed for each engagement.</p>'
      format: safe_html
