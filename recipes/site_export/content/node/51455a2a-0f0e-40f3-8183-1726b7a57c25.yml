      value: '<p>GovCMS consulting backed by experience in government websites and the engineering behind the platform. We help you design, build and support practical solutions, with delivery environments and architecture suited to your requirements and budget.</p>'
      format: basic
  markup:
    -
      value: '<h2>Experience across sites and the platform</h2><p>We bring together GovCMS site delivery, Drupal architecture and an understanding of the tooling that supports development and releases. Our work can span content models, accessible interfaces, integrations, upgrades and ongoing application support.</p><p>Our experience includes Free Sauce’s APSC GovCMS redevelopment, with backend and frontend implementation by Feb Dao. Lead consultant Simon Hobbs’s career experience includes rebuilding the NHMRC Committee Centre on Drupal 10 and GovCMS PaaS, and Department of Finance work improving GovCMS SaaS/PaaS developer tooling, documentation and scaffolds using Docker, GitLab and Lagoon.</p><h2>Architecture that works with GovCMS</h2><p>We help you work through the differences between SaaS and PaaS, the capabilities available to your site and the responsibilities of your delivery team. The aim is to use the platform well, choosing supported approaches and identifying integration or hosting decisions early.</p><h2>DrevOps and platform delivery</h2><p>We work with DrevOps on GovCMS architecture and implementation, bringing complementary Drupal, DevOps, testing and support capability into engagements where it fits. DrevOps’s platform experience includes contributing to the GovCMS build scaffold as a subcontractor to Salsa Digital.</p><p>We agree delivery roles and responsibilities for each project, connecting platform knowledge with practical implementation and ongoing support.</p><h2>Practical development and preview environments</h2><p>We can use tools such as Vortex, DrevOps’s open-source Drupal project template, to support consistent local development, automated testing and delivery pipelines. Vortex includes Acquia and Lagoon integrations with preview-environment support, providing options we can assess alongside your GovCMS delivery arrangements.</p><p>Complementary preview environments can give developers and stakeholders a practical place to test and review changes. Matching hosting and tooling to that purpose can help control costs and reduce friction, while keeping the production platform’s requirements clear.</p><p>We plan for differences between those environments and GovCMS, including configuration, data handling and supported functionality. Platform-specific checks remain part of release preparation, so an economical preview approach supports delivery without hiding constraints that matter in production.</p><h2>Plan your engagement</h2><p>Start with your goals, current systems and delivery constraints. We can agree the scope, priorities and appropriate specialists for your project, including any platform, access or assurance requirements.</p><h2>Related services</h2><ul><li><a href="/ce/services/drupal-cms">Drupal CMS</a></li><li><a href="/ce/services/cloud-platforms">Cloud Platforms</a></li><li><a href="/ce/services/drupal-devops">Drupal DevOps</a></li></ul><p><a href="/ce/services">Explore all services</a></p>'
      format: safe_html
