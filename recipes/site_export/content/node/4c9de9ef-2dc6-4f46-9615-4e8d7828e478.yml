  lead:
    -
      value: '<p>Create digital experiences that feel clear, considered and easy to use. Our network of UX and UI designers brings research, interaction design and visual design together to connect user needs with your organisation’s goals.</p>'
      format: basic
  markup:
    -
      value: '<h2>Start with people and purpose</h2><p>Good design begins with understanding the people who will use a service and what they need to achieve. We work with your team to explore user needs, business goals and technical constraints, turning those insights into a clear direction for the experience.</p><p>Interviews, stakeholder workshops and reviews of existing journeys can help identify what is working, where people struggle and which improvements deserve attention.</p><h2>Make ideas tangible</h2><p>We develop user journeys, wireframes and interactive prototypes that give everyone something practical to explore. From early concepts to detailed desktop and mobile designs, we shape navigation, page layouts and interactions around the tasks people need to complete.</p><p>Visual design brings those decisions together through typography, colour, spacing and reusable interface patterns, creating a coherent experience that reflects your organisation.</p><h2>Test, learn and refine</h2><p>We use feedback and usability testing to challenge assumptions and improve the design before and during development. Accessibility and inclusive design inform the work throughout, helping us consider different abilities, devices and ways of interacting.</p><h2>Design with delivery in mind</h2><p>Our designers work closely with clients, developers and content specialists to keep the design grounded in the platform and the project. Clear design guidance, collaborative handover and review of the built experience help carry the intent through to delivery.</p><p>Whether you need help shaping a new service, refreshing an existing interface or improving a particular journey, we can bring the right design capability into your team.</p><h2>Plan your engagement</h2><p>Start with your goals, current systems and delivery constraints. We can agree the scope, priorities and appropriate specialists for your project, including any platform, access or assurance requirements.</p><h2>Related services</h2><ul><li><a href="/ce/services/user-research-and-service-design">User Research and Service Design</a></li><li><a href="/ce/services/govcms">GovCMS</a></li></ul><p><a href="/ce/services">Explore all services</a></p>'
      format: safe_html
