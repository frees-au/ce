  lead:
    -
      value: '<p>Bring us the ambitious Drupal project: a complex public website, a connected service platform or an application that needs more than standard publishing. We combine experienced architectural thinking with hands-on engineering to help you shape it, build it and keep it maintainable.</p>'
      format: basic
  markup:
    -
      value: '<h2>Make more possible with Drupal</h2><p>We help organisations turn substantial requirements into Drupal solutions that work for their audiences and delivery teams. From large content platforms to applications with complex relationships and workflows, we bring the architecture and implementation together.</p><p>That can mean designing content models, building custom modules and themes, connecting business systems and search, or working through the boundaries between Drupal and a separate front end. We consider editorial experience, accessibility, security and long-term maintenance alongside the features you want to deliver.</p><h2>Experience with complex platforms</h2><p>Our capability draws on lead consultant Simon Hobbs’s career experience, including solution architecture for the NSW OneCX whole-of-government Drupal platform, a Drupal 10 and GovCMS PaaS rebuild of the NHMRC Committee Centre, and migration and re-architecture work on a Victorian justice platform.</p><p>His experience also includes technical leadership for an NSW SES website rebuild and Department of Finance work on GovCMS SaaS/PaaS developer tooling. These are examples of the experience we bring to an engagement, spanning content architecture, integrations, application development and the systems needed to deliver and operate a site.</p><h2>Work closely from idea to delivery</h2><p>We work directly with your team to understand what you want to achieve, test architectural choices and build a practical path to delivery. Whether you need an experienced consultant alongside your developers or specialist help with a difficult part of the platform, we can agree an engagement around the work.</p><p>GovCMS is one area of our Drupal experience. We can help you understand its platform constraints and delivery requirements, as well as design Drupal solutions for other hosting environments.</p><h2>Plan your engagement</h2><p>Start with your goals, current systems and delivery constraints. We can agree the scope, priorities and appropriate specialists for your project, including any platform, access or assurance requirements.</p><h2>Related services</h2><ul><li><a href="/ce/services/open-source">Open Source</a></li><li><a href="/ce/services/cloud-platforms">Cloud Platforms</a></li><li><a href="/ce/services/headless-and-decoupled-solutions">Headless and Decoupled Solutions</a></li><li><a href="/ce/services/decoupled-cms">Decoupled CMS</a></li><li><a href="/ce/services/govcms">GovCMS</a></li><li><a href="/ce/services/drupal-devops">Drupal DevOps</a></li></ul><p><a href="/ce/services">Explore all services</a></p>'
      format: safe_html
