config:
  strict: false
  actions:
    core.date_format.fallback:
      setProperties:
        langcode: en
        status: true
        label: 'Fallback date format'
        locked: true
        pattern: 'D, m/d/Y - H:i'
    core.date_format.html_date:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Date'
        locked: true
        pattern: Y-m-d
    core.date_format.html_datetime:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Datetime'
        locked: true
        pattern: 'Y-m-d\TH:i:sO'
    core.date_format.html_month:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Month'
        locked: true
        pattern: Y-m
    core.date_format.html_time:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Time'
        locked: true
        pattern: 'H:i:s'
    core.date_format.html_week:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Week'
        locked: true
        pattern: Y-\WW
    core.date_format.html_year:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Year'
        locked: true
        pattern: 'Y'
    core.date_format.html_yearless_date:
      setProperties:
        langcode: en
        status: true
        label: 'HTML Yearless date'
        locked: true
        pattern: m-d
    core.date_format.long:
      setProperties:
        langcode: en
        status: true
        label: 'Default long date'
        locked: false
        pattern: 'l, F j, Y - H:i'
    core.date_format.medium:
      setProperties:
        langcode: en
        status: true
        label: 'Default medium date'
        locked: false
        pattern: 'D, d/m/Y - H:i'
    core.date_format.short:
      setProperties:
        langcode: en
        status: true
        label: 'Default short date'
        locked: false
        pattern: d/m/Y
    core.entity_form_mode.user.register:
      setProperties:
        langcode: en
        status: true
        label: Register
        description: null
        targetEntityType: user
        cache: true
    core.entity_view_mode.user.compact:
      setProperties:
        langcode: en
        status: true
        label: Compact
        description: ''
        targetEntityType: user
        cache: true
    core.entity_view_mode.user.full:
      setProperties:
        langcode: en
        status: false
        label: 'User account'
        description: ''
        targetEntityType: user
        cache: true
    core.menu.static_menu_link_overrides:
      simpleConfigUpdate:
        definitions:
          contact__site_page:
            menu_name: footer
            parent: ''
            weight: 0
            expanded: false
            enabled: true
          standard__front_page:
            menu_name: main
            parent: ''
            weight: -50
            expanded: false
            enabled: false
    system.action.user_block_user_action:
      setProperties:
        langcode: en
        status: true
        label: 'Block the selected user(s)'
        type: user
        plugin: user_block_user_action
        configuration: {  }
    system.action.user_cancel_user_action:
      setProperties:
        langcode: en
        status: true
        label: 'Cancel the selected user account(s)'
        type: user
        plugin: user_cancel_user_action
        configuration: {  }
    system.action.user_unblock_user_action:
      setProperties:
        langcode: en
        status: true
        label: 'Unblock the selected user(s)'
        type: user
        plugin: user_unblock_user_action
        configuration: {  }
    system.advisories:
      simpleConfigUpdate:
        enabled: true
        interval_hours: 6
    system.cron:
      simpleConfigUpdate:
        threshold:
          requirements_warning: 172800
          requirements_error: 1209600
        logging: true
    system.date:
      simpleConfigUpdate:
        first_day: 0
        country:
          default: AU
        timezone:
          default: Australia/Melbourne
          user:
            configurable: true
            default: 0
            warn: false
    system.diff:
      simpleConfigUpdate:
        context:
          lines_leading: 2
          lines_trailing: 2
    system.feature_flags:
      simpleConfigUpdate:
        linkset_endpoint: false
    system.file:
      simpleConfigUpdate:
        allow_insecure_uploads: false
        default_scheme: public
        temporary_maximum_age: 43200
    system.image.gd:
      simpleConfigUpdate:
        jpeg_quality: 100
    system.image:
      simpleConfigUpdate:
        toolkit: gd
    system.logging:
      simpleConfigUpdate:
        error_level: hide
    system.mail:
      simpleConfigUpdate:
        interface:
          default: php_mail
        mailer_dsn:
          scheme: sendmail
          host: default
          user: null
          password: null
          port: null
          options: {  }
    system.maintenance:
      simpleConfigUpdate:
        langcode: en
        message: '@site is currently under maintenance. We should be back shortly. Thank you for your patience.'
    system.menu.account:
      setProperties:
        langcode: en
        status: true
        label: 'User account menu'
        description: 'Links related to the active user account'
        locked: true
    system.menu.admin:
      setProperties:
        langcode: en
        status: true
        label: Administration
        description: 'Administrative task links'
        locked: true
    system.menu.footer:
      setProperties:
        langcode: en
        status: true
        label: Footer
        description: 'Site information links'
        locked: true
    system.menu.main:
      setProperties:
        langcode: en
        status: true
        label: 'Main navigation'
        description: 'Site section links'
        locked: true
    system.menu.tools:
      setProperties:
        langcode: en
        status: true
        label: Tools
        description: 'User tool links, often added by modules'
        locked: true
    system.performance:
      simpleConfigUpdate:
        cache:
          page:
            max_age: 2700
        css:
          preprocess: true
          compress: true
        fast_404:
          enabled: true
          paths: '/\.(?:txt|png|gif|jpe?g|css|js|ico|swf|flv|cgi|bat|pl|dll|exe|asp)$/i'
          exclude_paths: '/\/(?:styles|imagecache)\//'
          html: '<!DOCTYPE html><html><head><title>404 Not Found</title></head><body><h1>Not Found</h1><p>The requested URL "@path" was not found on this server.</p></body></html>'
        js:
          preprocess: true
          compress: true
    system.site:
      simpleConfigUpdate:
        langcode: en
        slogan: 'Free as in …'
        page:
          403: ''
          404: ''
          front: /ce
        admin_compact_mode: false
        weight_select_max: 100
        default_langcode: en
        mail_notification: ''
    system.theme.global:
      simpleConfigUpdate:
        favicon:
          mimetype: image/vnd.microsoft.icon
          path: ''
          url: ''
          use_default: true
        features:
          comment_user_picture: true
          comment_user_verification: true
          favicon: true
          node_user_picture: true
        logo:
          path: ''
          url: null
          use_default: true
    system.theme:
      simpleConfigUpdate:
        admin: gin
        default: fstheme
    user.flood:
      simpleConfigUpdate:
        uid_only: false
        ip_limit: 50
        ip_window: 3600
        user_limit: 5
        user_window: 21600
    user.mail:
      simpleConfigUpdate:
        langcode: en
        cancel_confirm:
          subject: 'Account cancellation request for [user:display-name] at [site:name]'
          body: "[user:display-name]\r\n\r\nA request to cancel your account has been made at [site:name].\r\n\r\nYou may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:cancel-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires in one day and nothing will happen if it is not used.\r\n\r\n--  [site:name] team"
        password_reset:
          subject: 'Replacement login information for [user:display-name] at [site:name]'
          body: "[user:display-name],\r\n\r\nA request to reset the password for your account has been made at [site:name].\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.\r\n\r\n--  [site:name] team"
        register_admin_created:
          subject: 'An administrator created an account for you at [site:name]'
          body: "[user:display-name],\r\n\r\nA site administrator at [site:name] has created an account for you. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
        register_no_approval_required:
          subject: 'Account details for [user:display-name] at [site:name]'
          body: "[user:display-name],\r\n\r\nThank you for registering at [site:name]. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
        register_pending_approval:
          subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
          body: "[user:display-name],\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\n--  [site:name] team"
        register_pending_approval_admin:
          subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
          body: "[user:display-name] has applied for an account.\r\n\r\n[user:edit-url]"
        status_activated:
          subject: 'Account details for [user:display-name] at [site:name] (approved)'
          body: "[user:display-name],\r\n\r\nYour account at [site:name] has been activated.\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:account-name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
        status_blocked:
          subject: 'Account details for [user:display-name] at [site:name] (blocked)'
          body: "[user:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
        status_canceled:
          subject: 'Account details for [user:display-name] at [site:name] (canceled)'
          body: "[user:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
    user.role.anonymous:
      setProperties:
        langcode: en
        status: true
        label: 'Anonymous user'
        weight: 0
        is_admin: false
        permissions:
          - 'access content'
          - 'use text format basic'
          - 'view media'
    user.role.authenticated:
      setProperties:
        langcode: en
        status: true
        label: 'Authenticated user'
        weight: 1
        is_admin: false
        permissions:
          - 'access content'
          - 'delete own files'
          - 'use text format basic'
          - 'view media'
    user.settings:
      simpleConfigUpdate:
        langcode: en
        anonymous: Anonymous
        verify_mail: true
        notify:
          cancel_confirm: true
          password_reset: true
          status_activated: true
          status_blocked: false
          status_canceled: false
          register_admin_created: true
          register_no_approval_required: true
          register_pending_approval: true
        register: admin_only
        cancel_method: user_cancel_block
        password_reset_timeout: 86400
        password_strength: true
